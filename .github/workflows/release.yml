name: Release preview
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: release
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release
      - name: Read version
        run: |
          version=$(dotnet msbuild src/CommunityToolkit.Aspire.Hosting.Garage -getProperty:Version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]] || exit 1
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish provisioner
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/patrickmatthiesen/garage-provisioner:${{ env.RELEASE_VERSION }}
          labels: org.opencontainers.image.source=https://github.com/PatrickMatthiesen/CommunityToolkit.Aspire.Hosting.Garage
      - run: dotnet pack src/CommunityToolkit.Aspire.Hosting.Garage -c Release -o artifacts/packages
      - name: Publish package artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum artifacts/packages/*.nupkg > artifacts/packages/SHA256SUMS
          gh release create "v$RELEASE_VERSION" artifacts/packages/*.nupkg artifacts/packages/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "Garage integration $RELEASE_VERSION" --notes "Independent preview integration. Package requires the matching Garage provisioner image. Not an official Community Toolkit release."
